<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب توظيف - مركز غسيل المعرة</title>
    <!-- استدعاء خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --accent: #0f766e;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --focus-ring: rgba(2, 132, 199, 0.25);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%);
            color: #ffffff;
            padding: 36px 24px;
            text-align: center;
            position: relative;
        }

        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .card-header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-header p {
            font-size: 0.95rem;
            opacity: 0.95;
            margin-bottom: 16px;
        }

        .inquiry-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #ffffff;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            direction: ltr;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .inquiry-box span {
            color: var(--primary);
        }

        .card-body {
            padding: 32px 24px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .input-control {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        select.input-control {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2064748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 14px center;
            background-size: 16px;
        }

        .radio-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }

        .radio-card {
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .radio-card:hover {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .radio-card input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .radio-card has(:checked) {
            border-color: var(--primary);
            background-color: rgba(2, 132, 199, 0.05);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
            margin-top: 10px;
        }

        .btn-submit:hover {
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .card-header h1 {
                font-size: 1.4rem;
            }
            .card-body {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الهيدر الاحترافي -->
        <div class="card-header">
            <span class="badge">فرصة عمل</span>
            <h1>مركز غسيل المعرة</h1>
            <p>طلب استثمار شواغر: فني كلية / ممرض</p>
            <div class="inquiry-box">
                <span>للاستفسار:</span> +46790436692
            </div>
        </div>

        <!-- جسم الاستمارة مع رابط Formspree الخاص بك مباشرة -->
        <div class="card-body">
            <form action="https://formspree.io/f/mljjqrnj" method="POST" class="form-grid">

                <div class="form-group">
                    <label for="fullName">الاسم الثلاثي *</label>
                    <input type="text" id="fullName" name="الاسم الثلاثي" class="input-control" required placeholder="أدخل اسمك الثلاثي">
                </div>

                <div class="form-group">
                    <label for="address">مكان الإقامة الحالي *</label>
                    <input type="text" id="address" name="مكان الإقامة الحالي" class="input-control" required placeholder="مثال: المعرة، إدلب...">
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف *</label>
                    <input type="tel" id="phone" name="رقم الهاتف" class="input-control" required placeholder="05XXXXXXXX" dir="ltr" style="text-align: right;">
                </div>

                <div class="form-group">
                    <label for="idType">إثبات الشخصية *</label>
                    <select id="idType" name="نوع إثبات الشخصية" class="input-control" required>
                        <option value="" disabled selected>اختر نوع الإثبات المتاح لديك</option>
                        <option value="هوية شخصية">هوية شخصية</option>
                        <option value="جواز سفر">جواز سفر</option>
                        <option value="إخراج قيد">إخراج قيد</option>
                        <option value="دفتر عائلة">دفتر عائلة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="qualification">المؤهل العلمي *</label>
                    <select id="qualification" name="المؤهل العلمي" class="input-control" required>
                        <option value="" disabled selected>اختر المؤهل العلمي</option>
                        <option value="مدرسة تمريض">مدرسة تمريض</option>
                        <option value="كلية تمريض">كلية تمريض</option>
                        <option value="طوارئ">طوارئ</option>
                        <option value="تخدير">تخدير</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="specialty">الاختصاص *</label>
                    <select id="specialty" name="الاختصاص" class="input-control" required>
                        <option value="" disabled selected>اختر الاختصاص الدقيق</option>
                        <option value="فني كلية">فني كلية</option>
                        <option value="تمريض">تمريض</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>هل لديك عقد حالياً؟ *</label>
                    <div class="radio-wrapper">
                        <label class="radio-card">
                            <input type="radio" name="هل لديك عقد" value="نعم" required>
                            <span>نعم</span>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="هل لديك عقد" value="لا" required>
                            <span>لا</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">إرسال الطلب الآن</button>

            </form>
        </div>
    </div>

</body>
</html>
