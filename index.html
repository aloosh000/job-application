<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب توظيف - مركز غسيل المعرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --border-color: #cbd5e1;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px 16px; }
        .card { width: 100%; max-width: 600px; background-color: var(--card-bg); border-radius: var(--radius); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08); border: 1px solid #e2e8f0; overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #0284c7 0%, #0f766e 100%); color: #ffffff; padding: 36px 24px; text-align: center; }
        .card-header h1 { font-size: 1.65rem; font-weight: 800; margin-bottom: 8px; }
        .card-header p { font-size: 0.95rem; opacity: 0.95; margin-bottom: 16px; }
        .inquiry-box { display: inline-flex; align-items: center; gap: 8px; background-color: #ffffff; color: var(--text-main); padding: 8px 16px; border-radius: 50px; font-weight: 700; font-size: 0.9rem; direction: ltr; }
        .card-body { padding: 32px 24px; }
        .form-grid { display: flex; flex-direction: column; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-weight: 700; font-size: 0.95rem; }
        .input-control { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; outline: none; }
        .input-control:focus { border-color: var(--primary); }
        .radio-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .radio-card { border: 1.5px solid var(--border-color); border-radius: 10px; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .btn-submit { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; padding: 16px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h1>مركز غسيل المعرة</h1>
            <p>طلب استثمار شواغر: فني كلية / ممرض</p>
            <div class="inquiry-box">للاستفسار: +46790436692</div>
        </div>

        <div class="card-body">
            <!-- تم توجيه Form مباشرة لـ Google Form عبر Target iframe مخفي -->
            <form id="googleForm" action="https://docs.google.com/forms/d/e/1FAIpQLScCVoEfkEJ5renHnCwsCQd52JIHU_fZSzcWo5A1UjPepCGriQ/formsponse?usp=pp_url&entry.1723342991=%D8%A7%D9%84%D8%AE%D9%8A%D8%A7%D8%B1+%D8%B1%D9%82%D9%85+1" method="POST" target="hidden_iframe" onsubmit="submitted=true;">

                <div class="form-group">
                    <label>الاسم الثلاثي *</label>
                    <!-- استبدل entry.123456 بالرقم الخص بك من جوجل -->
                    <input type="text" name="entry.123456" class="input-control" required placeholder="أدخل اسمك الثلاثي">
                </div>

                <div class="form-group">
                    <label>مكان الإقامة الحالي *</label>
                    <input type="text" name="entry.234567" class="input-control" required placeholder="مثال: المعرة">
                </div>

                <div class="form-group">
                    <label>رقم الهاتف *</label>
                    <input type="tel" name="entry.345678" class="input-control" required placeholder="05XXXXXXXX" dir="ltr" style="text-align: right;">
                </div>

                <div class="form-group">
                    <label>إثبات الشخصية *</label>
                    <select name="entry.456789" class="input-control" required>
                        <option value="" disabled selected>اختر نوع الإثبات</option>
                        <option value="هوية شخصية">هوية شخصية</option>
                        <option value="جواز سفر">جواز سفر</option>
                        <option value="إخراج قيد">إخراج قيد</option>
                        <option value="دفتر عائلة">دفتر عائلة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>المؤهل العلمي *</label>
                    <select name="entry.567890" class="input-control" required>
                        <option value="" disabled selected>اختر المؤهل العلمي</option>
                        <option value="مدرسة تمريض">مدرسة تمريض</option>
                        <option value="كلية تمريض">كلية تمريض</option>
                        <option value="طوارئ">طوارئ</option>
                        <option value="تخدير">تخدير</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>الاختصاص *</label>
                    <select name="entry.678901" class="input-control" required>
                        <option value="" disabled selected>اختر الاختصاص</option>
                        <option value="فني كلية">فني كلية</option>
                        <option value="تمريض">تمريض</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>هل لديك عقد حالياً؟ *</label>
                    <div class="radio-wrapper">
                        <label class="radio-card">
                            <input type="radio" name="entry.789012" value="نعم" required> نعم
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="entry.789012" value="لا" required> لا
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">إرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- Iframe مخفي يستقبل الإجابة بدون مغادرة موقعك -->
    <script type="text/javascript">var submitted=false;</script>
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {alert('تم إرسال طلبك بنجاح!'); window.location.reload();}"></iframe>

</body>
</html>
